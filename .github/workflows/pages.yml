# Build the Expo web app and publish it to GitHub Pages (https://khristo19.github.io/kvali/).
name: Deploy web demo

on:
  push:
    branches: [main]
    paths: ["app/**", "services/proof/src/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx expo export --platform web
      # Keep the _expo folder (Jekyll would drop it) and serve the not-found page on unknown paths.
      - run: touch dist/.nojekyll && cp "dist/+not-found.html" dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
