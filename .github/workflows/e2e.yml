# End-to-end tests (Playwright, chromium) against the web demo: live (main) and staging (staging branch, /staging/). Runs in the cloud only, never on the laptop.
# Primary check after every deploy; also runnable by hand (Actions > E2E (live demo) > Run workflow).
name: E2E (live demo)

on:
  workflow_run:
    workflows: ["Deploy web demo"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: "Which site to test (ignored when base_url is set)"
        required: false
        type: choice
        options: [live, staging]
        default: live
      base_url:
        description: "Site to test, overrides target (e.g. another deployment)"
        required: false
        default: ""

permissions:
  contents: read

# One E2E run at a time: the journey uses the shared public devnet.
concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  # Which site does this run test? A deploy triggered by a push to `staging` tests the staging site; a deploy from `main` tests live.
  plan:
    name: Plan
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.p.outputs.target }}
      url: ${{ steps.p.outputs.url }}
      sha: ${{ steps.p.outputs.sha }}
    steps:
      - id: p
        run: |
          LIVE=https://khristo19.github.io/kvali/
          STG=https://khristo19.github.io/kvali/staging/
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            T="${{ inputs.target }}"; URL="${{ inputs.base_url }}"
            [ -z "$URL" ] && { [ "$T" = staging ] && URL=$STG || URL=$LIVE; }
            [ -z "$T" ] && T=live
            case "$URL" in */staging*) T=staging;; esac
            SHA="${{ github.sha }}"
          else
            if [ "${{ github.event.workflow_run.head_branch }}" = staging ]; then T=staging; URL=$STG; else T=live; URL=$LIVE; fi
            SHA="${{ github.event.workflow_run.head_sha }}"
          fi
          echo "target=$T" >> "$GITHUB_OUTPUT"; echo "url=$URL" >> "$GITHUB_OUTPUT"; echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Testing $T at $URL (tests from $SHA)"

  journey:
    name: Journey + refusal (devnet, serial)
    needs: plan
    env:
      E2E_BASE_URL: ${{ needs.plan.outputs.url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run journey + refusal specs (one worker)
        run: npx playwright test journey.spec.ts refusal.spec.ts switcher.spec.ts --project=desktop --workers=1
      - name: Summary
        if: always()
        run: node scripts/summary.mjs "Journey + refusal (devnet)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots
          path: e2e/shots/
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-journey-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/report-json/
          retention-days: 14
          if-no-files-found: ignore

  nav:
    name: Navigation + layout (desktop and 390 px)
    needs: plan
    env:
      E2E_BASE_URL: ${{ needs.plan.outputs.url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run nav spec (desktop + mobile projects, parallel)
        run: npx playwright test nav.spec.ts --workers=2
      - name: Summary
        if: always()
        run: node scripts/summary.mjs "Navigation + layout" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-nav-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/report-json/
          retention-days: 14
          if-no-files-found: ignore
