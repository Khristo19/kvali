[package]
name = "kvali"
version = "0.1.0"
description = "Escrowed, volume-verified agricultural spray jobs on Solana"
edition = "2021"
# Solana platform-tools (cargo-build-sbf, Solana 2.1) ship rustc/cargo 1.79;
# this keeps the lockfile on dependency versions that toolchain can build.
rust-version = "1.79"

[lib]
crate-type = ["cdylib", "lib"]
name = "kvali"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
