<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kvali — Welcome, pick your role</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#2F5D3E}a:hover{color:#16241C}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F1E8; color: #3E4A40; font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; font-size: 16px; line-height: 1.45; display: flex; flex-direction: column; padding: 64px 20px 28px">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
    <div aria-hidden="true" style="width: 72px; height: 72px; border-radius: 20px; background: #2F5D3E; display: flex; align-items: center; justify-content: center">
      <svg width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="#F4F1E8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 6c-6 8-10 13-10 19a10 10 0 0 0 20 0c0-6-4-11-10-19z"/><path d="M15 27l5 5 9-10"/></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 40px; line-height: 1; font-weight: 700; color: #16241C; letter-spacing: -0.02em">Kvali</h1>
      <p style="margin: 0; font-size: 18px; color: #5E685B">Proof of spray</p>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 44px">
    <h2 style="margin: 0 0 4px; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 22px; font-weight: 700; color: #16241C">Who are you?</h2>

    <sc-for list="{{roles}}" as="role" hint-placeholder-count="3">
      <button type="button" onClick="{{role.pick}}" aria-pressed="{{role.selected}}" style="{{role.style}}">
        <span style="width: 44px; height: 44px; border-radius: 12px; background: #F4F1E8; border: 1px solid #DCD7C6; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <sc-if value="{{role.isFarmer}}" hint-placeholder-val="{{true}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2F5D3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M4 20V11l8-6 8 6v9"/><path d="M9 20v-6h6v6"/></svg></sc-if>
          <sc-if value="{{role.isOperator}}" hint-placeholder-val="{{false}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2F5D3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="5" r="2.5"/><circle cx="19" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><rect x="9" y="9" width="6" height="6" rx="1.5"/><path d="M7 7l2 2M17 7l-2 2M7 17l2-2M17 17l-2-2"/></svg></sc-if>
          <sc-if value="{{role.isValidator}}" hint-placeholder-val="{{false}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2F5D3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg></sc-if>
        </span>
        <span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
          <span style="font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 19px; font-weight: 700; color: #16241C">{{role.title}}</span>
          <span style="font-size: 16px; color: #5E685B">{{role.desc}}</span>
        </span>
        <span aria-hidden="true" style="{{role.dotStyle}}"></span>
      </button>
    </sc-for>
  </div>

  <div style="flex: 1"></div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <a href="FarmerJobStatus.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; padding: 12px 20px; border-radius: 14px; background: #2F5D3E; color: #FBFAF5; font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; font-size: 18px; font-weight: 600; text-decoration: none; box-sizing: border-box">Continue with email</a>
    <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; padding: 12px 20px; border-radius: 14px; background: #FBFAF5; border: 1.5px solid #DCD7C6; color: #16241C; font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; font-size: 18px; font-weight: 600; cursor: pointer">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16241C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.3" fill="#16241C" stroke="none"/></svg>
      <span>Connect Phantom</span>
    </button>
    <p style="margin: 6px 0 0; text-align: center; font-size: 16px; color: #5E685B">A secure account is created for you. No crypto knowledge needed.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'farmer' };
  }
  renderVals() {
    const picked = this.state.picked;
    const base = "display: flex; align-items: center; gap: 14px; width: 100%; min-height: 84px; padding: 16px; border-radius: 14px; text-align: left; cursor: pointer; font-family: inherit; box-sizing: border-box;";
    const defs = [
      { id: 'farmer', title: 'Farmer', desc: 'I need my field sprayed' },
      { id: 'operator', title: 'Drone operator', desc: 'I spray fields with my drone' },
      { id: 'validator', title: 'Validator', desc: 'I am an agronomist who checks proof' }
    ];
    const roles = defs.map((r) => {
      const selected = r.id === picked;
      return {
        ...r,
        selected,
        isFarmer: r.id === 'farmer',
        isOperator: r.id === 'operator',
        isValidator: r.id === 'validator',
        style: base + (selected
          ? "background: #FBFAF5; border: 2px solid #2F5D3E;"
          : "background: #FBFAF5; border: 1.5px solid #DCD7C6;"),
        dotStyle: "width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; box-sizing: border-box;" + (selected
          ? "border: 8px solid #2F5D3E; background: #FBFAF5;"
          : "border: 2px solid #DCD7C6; background: #FBFAF5;"),
        pick: () => this.setState({ picked: r.id })
      };
    });
    return { roles };
  }
}
</script>
</body>
</html>
